<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>01 온보딩</title>
<link rel="stylesheet" href="app.css">
<style>
  /* OnboardingScreen — 싶 작성 화면처럼 흰 바탕 */
  .onboarding-screen { background: var(--gray1); }
  .onb { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 40px; padding: 24px 32px; min-height: 0; }
  .onb__hello { justify-content: center; align-items: flex-start; gap: 16px; }
  .stepper { display: flex; gap: 4px; }
  .stepper span { width: 24px; height: 4px; border-radius: 2px; background: var(--gray2-5); }
  .stepper span.is-done { background: var(--tennis-green); }
  .speech { padding: 12px 14px; border-radius: var(--radius-card); background: var(--gray2); }
  .family-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .family-grid .member-toggle { min-height: 96px; }
  .member-toggle--add { border: 1.5px dashed var(--gray3); background: none; color: var(--gray4); align-items: center; justify-content: center; font-size: 14px; font-weight: 500; }
  .member-toggle--add img { width: 16px; height: 16px; }
</style>
</head>
<body data-title="01 온보딩 — 차 이름 짓기 + 가족 등록">
<div class="display">
  <div class="app-slot">
    <section class="app-window onboarding-screen">
      <div class="onb">
        <!-- 왼쪽: 차가 말 걸기 -->
        <div class="col onb__hello">
          <div class="stepper"><span class="is-done"></span><span class="is-done"></span><span></span></div>
          <svg class="stamp stamp--xl"><use href="#stamp-car"/></svg>
          <div class="speech t-wish-title">안녕! 나는 우리 가족 차야.<br>이제부터 함께 달린 길을<br>내가 일기로 남겨줄게 🚗</div>
        </div>

        <!-- 오른쪽: 1) 이름 2) 가족 -->
        <div class="col g40" style="justify-content:center">
          <div class="col g16">
            <div class="t-wish-title c-secondary">① 내 이름을 지어줄래?</div>
            <div class="field">소나<span class="caret"></span></div>
            <div class="chip-group">
              <span class="chip is-selected">소나</span><span class="chip">붕붕이</span><span class="chip">하늘이</span><span class="chip">씽씽이</span>
            </div>
          </div>
          <div class="col g16">
            <div class="t-wish-title c-secondary">② 같이 타는 가족을 알려줘</div>
            <div class="family-grid">
              <div class="member-toggle is-selected"><span class="avatar avatar--l">👨</span>아빠<img class="check" src="assets/icons/ic_check_on.png" alt="선택됨"></div>
              <div class="member-toggle is-selected"><span class="avatar avatar--l">👩</span>엄마<img class="check" src="assets/icons/ic_check_on.png" alt="선택됨"></div>
              <div class="member-toggle is-selected"><span class="avatar avatar--l">👦</span>준 · 7살<img class="check" src="assets/icons/ic_check_on.png" alt="선택됨"></div>
              <div class="member-toggle is-selected"><span class="avatar avatar--l">👧</span>서아 · 4살<img class="check" src="assets/icons/ic_check_on.png" alt="선택됨"></div>
              <div class="member-toggle member-toggle--add"><img src="assets/icons/ic_small_plus.png" alt="">가족 추가</div>
            </div>
          </div>
          <div class="row">
            <button class="btn btn--l btn--basic">이전</button>
            <button class="btn btn--l btn--filled grow">다음 · 아이 자리 정하기</button>
          </div>
        </div>
      </div>
    </section>
  </div>
</div>
<script src="stamps.js"></script>
<script src="frame.js"></script>
</body>
</html>
