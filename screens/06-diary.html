<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>06 오늘의 그림일기</title>
<link rel="stylesheet" href="app.css">
<style>
  /* DiaryDocument — 싶 WishDetailDocument(읽는 문서): 흰 한 장, 카드·구분선 없이 섹션 사이 여백으로만 나눈다 */
  .diary-screen { background: var(--gray1); }
  .doc-bar { display: flex; align-items: center; justify-content: space-between; padding: 8px 10px 0; }
  .doc { flex: 1; min-height: 0; display: grid; grid-template-columns: 1.35fr 1fr; gap: 48px; padding: 4px 36px 24px; overflow: hidden; }
  .doc__main { display: flex; flex-direction: column; min-width: 0; }
  .doc__stamps { display: flex; gap: 8px; }
  .doc__title { margin-top: 12px; font-size: 26px; line-height: 36px; font-weight: 700; }
  .doc__dday { margin-top: 6px; display: flex; align-items: baseline; gap: 10px; }
  .doc__num { font-size: 30px; line-height: 36px; font-weight: 800; color: var(--seep-blue); }
  .doc__date { font-size: 14px; line-height: 20px; font-weight: 500; color: var(--gray4); }
  .doc__meta { margin-top: 12px; display: flex; align-items: center; gap: 6px; font-size: 14px; line-height: 22px; color: var(--gray4); }
  .doc__dot { color: var(--gray3); }
  .doc__body { margin-top: 28px; font-size: 16px; line-height: 28px; }
  .doc__sign { margin-top: auto; font-size: 12px; color: var(--gray4); }
  .doc__side { display: flex; flex-direction: column; gap: 40px; min-width: 0; padding-top: 64px; }
  .doc-sec__head { display: flex; align-items: center; justify-content: space-between; height: 22px; margin-bottom: 10px; font-size: 14px; font-weight: 500; color: var(--gray4); }
  .doc-sec__head b { margin-left: 6px; color: var(--gray5); font-weight: 700; }
  .scene { display: flex; align-items: center; gap: 12px; height: 44px; font-size: 16px; }
  .scene .num { width: 44px; flex: none; font-size: 14px; color: var(--gray4); font-weight: 600; }
  .doc__amt { font-size: 22px; line-height: 28px; font-weight: 800; }
  .doc__amt small { margin-left: 4px; font-size: 14px; font-weight: 400; color: var(--gray4); }
  .doc__msg { margin-top: 8px; font-size: 14px; line-height: 20px; }
  .doc__msg b { color: var(--seep-blue); }
  @container (max-width: 600px) {
    .doc { grid-template-columns: 1fr; gap: 32px; padding: 4px 24px 20px; }
    .doc__side { padding-top: 0; gap: 32px; }
    .doc__sign { display: none; }
  }
</style>
</head>
<body data-title="06 오늘의 그림일기 — 싶 '읽는 문서'" data-portrait="true">
<div class="display">
  <div class="app-slot">
    <section class="app-window diary-screen">
      <nav class="doc-bar">
        <button class="icon-btn"><img src="assets/icons/ic_chevron_back.png" alt="뒤로"></button>
        <button class="btn btn--link">다른 날 보기<img src="assets/icons/ic_arrow_right.png" alt=""></button>
      </nav>

      <div class="doc">
        <article class="doc__main">
          <div class="doc__stamps">
            <svg class="stamp stamp--l"><use href="#stamp-rain"/></svg>
            <svg class="stamp stamp--l"><use href="#stamp-highway"/></svg>
            <svg class="stamp stamp--l"><use href="#stamp-star"/></svg>
            <svg class="stamp stamp--l"><use href="#stamp-flag"/></svg>
          </div>
          <h1 class="doc__title">할머니 댁에 다녀온 날</h1>
          <div class="doc__dday"><span class="doc__num">87km</span><span class="doc__date">1시간 40분 · 11월 1일 일요일</span></div>
          <div class="doc__meta">
            <div class="avatar-stack"><span class="avatar avatar--s">👨</span><span class="avatar avatar--s">👩</span><span class="avatar avatar--s">👦</span></div>
            <span>아빠 · 엄마 · 준</span><span class="doc__dot">·</span><span>비 온 뒤 갬</span>
          </div>
          <p class="doc__body">
            오늘은 아빠, 엄마, 준이랑 할머니 댁에 다녀왔어. 87km를 1시간 40분 동안 달렸지.
            가는 길에 비가 와서 와이퍼가 좀 바빴어 ☔
            준이는 처음부터 끝까지 벨트를 잘 매고 있었어. 대견해 ⭐
          </p>
          <div class="doc__sign">— 소나가 씀</div>
        </article>

        <aside class="doc__side">
          <section>
            <div class="doc-sec__head"><span>오늘의 명장면<b>3</b></span></div>
            <div class="scene"><span class="num">10:42</span><svg class="stamp stamp--s"><use href="#stamp-rain"/></svg>비가 오기 시작했어</div>
            <div class="scene"><span class="num">11:05</span><svg class="stamp stamp--s"><use href="#stamp-highway"/></svg>쭉 뻗은 길 40분</div>
            <div class="scene"><span class="num">12:20</span><svg class="stamp stamp--s"><use href="#stamp-flag"/></svg>할머니 댁 도착</div>
          </section>
          <section>
            <div class="doc-sec__head"><span>준이랑 함께 달린 길</span></div>
            <div class="doc__amt">3,214km<small>/ 지구 한 바퀴 40,075km</small></div>
            <div class="progress progress--lg" style="margin-top: 10px"><span style="width:8%"></span></div>
            <div class="doc__msg">서울에서 부산까지 <b>4번 왕복</b>한 만큼이야 🌏</div>
          </section>
        </aside>
      </div>
    </section>
  </div>
</div>
<script src="stamps.js"></script>
<script src="frame.js"></script>
</body>
</html>
