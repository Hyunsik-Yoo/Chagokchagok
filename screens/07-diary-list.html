<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>07 일기 목록</title>
<link rel="stylesheet" href="app.css">
<style>
  /* DiaryCalendarScreen */
  .cal-layout { flex: 1; min-height: 0; display: grid; grid-template-columns: 1.25fr 1fr; gap: var(--space-list-gap); }
  .cal-head { display: flex; align-items: center; gap: 8px; }
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; text-align: center; }
  .cal__dow { font-size: 12px; font-weight: 500; color: var(--gray4); padding-bottom: 2px; }
  .cal__day { height: 50px; border-radius: var(--radius-card); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; font-size: 14px; font-weight: 600; color: var(--gray5); }
  .cal__day .stamp { width: 24px; height: 24px; }
  .cal__day.is-muted { color: var(--gray3); }
  .cal__day.is-selected { box-shadow: inset 0 0 0 2px var(--seep-blue); color: var(--seep-blue); }
  .preview-card .diary-text { font-size: 16px; line-height: 24px; }
</style>
</head>
<body data-title="07 일기 목록 — 월간 캘린더">
<div class="display">
  <div class="app-slot">
    <section class="app-window diary-list-screen">
      <header class="app-header">
        <svg class="stamp"><use href="#stamp-car"/></svg>
        <div class="app-header__title t-title-bold">소나의 일기</div>
        <nav class="tab-bar">
          <div class="tab-bar__item">홈</div>
          <div class="tab-bar__item is-selected">일기</div>
          <div class="tab-bar__item">거리</div>
          <div class="tab-bar__item">설정</div>
        </nav>
      </header>
      <main class="app-content">
        <div class="cal-layout">
          <article class="card">
            <div class="cal-head">
              <button class="icon-btn"><img src="assets/icons/ic_chevron_back.png" alt="뒤로"></button>
              <div class="t-title-bold grow" style="text-align:center">2026년 10월</div>
              <button class="icon-btn"><img src="assets/icons/ic_arrow_right.png" alt="다음"></button>
            </div>
            <div class="cal" id="cal"></div>
            <div class="t-caption c-tertiary">이번 달 <span class="num">14</span>개의 일기 · 함께 달린 길 <span class="num">612</span>km</div>
          </article>

          <!-- DiaryPreviewCard -->
          <article class="card preview-card">
            <div class="card__eyebrow">10월 31일 토요일</div>
            <div class="row center g16">
              <svg class="stamp stamp--l"><use href="#stamp-night"/></svg>
              <svg class="stamp stamp--l"><use href="#stamp-flag"/></svg>
            </div>
            <p class="diary-text grow">오늘은 엄마랑 서아랑 마트에 다녀왔어. 돌아오는 길엔 깜깜해서 불을 환하게 켜고 달렸지 🌙 서아는 뒷자리에서 꾸벅꾸벅 졸았어.</p>
            <div class="row center g16 t-body-sm c-secondary">
              <div class="avatar-stack"><span class="avatar avatar--s">👩</span><span class="avatar avatar--s">👧</span></div>
              <span class="num">24</span>km · <span class="num">52</span>분
            </div>
            <button class="btn btn--l btn--filled btn--block">일기 펼쳐보기</button>
          </article>
        </div>
      </main>
    </section>
  </div>
</div>
<script>
  // 2026년 10월: 1일 = 목요일. 일기 있는 날 → 대표 스탬프
  const stamps = { 3: 'sun', 4: 'flag', 9: 'highway', 10: 'star', 12: 'rain', 15: 'wind', 17: 'flag', 18: 'star', 22: 'cold', 24: 'highway', 25: 'rain', 28: 'fuel', 30: 'flag', 31: 'night' };
  const cal = document.getElementById('cal');
  let h = '일월화수목금토'.split('').map(d => `<div class="cal__dow">${d}</div>`).join('');
  for (const d of [27, 28, 29, 30]) h += `<div class="cal__day is-muted">${d}</div>`;
  for (let d = 1; d <= 31; d++) {
    const s = stamps[d] ? `<svg class="stamp"><use href="#stamp-${stamps[d]}"/></svg>` : '';
    h += `<div class="cal__day${d === 31 ? ' is-selected' : ''}">${s}${d}</div>`;
  }
  cal.innerHTML = h;
</script>
<script src="stamps.js"></script>
<script src="frame.js"></script>
</body>
</html>
