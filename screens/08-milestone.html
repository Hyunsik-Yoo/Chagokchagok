<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>08 함께 달린 거리</title>
<link rel="stylesheet" href="app.css">
<style>
  /* MilestoneScreen */
  .ms { flex: 1; min-height: 0; display: grid; grid-template-columns: 1.2fr 1fr; gap: var(--space-list-gap); }
  .hero { justify-content: space-between; }
  .hero__compare { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .hero__compare > div { padding: 10px 12px 12px; border-radius: var(--radius-card); background: var(--gray2); display: flex; flex-direction: column; gap: 2px; }
  .hero .num.big { font-size: 30px; line-height: 36px; }
  .road { position: relative; height: 8px; border-radius: 4px; background: var(--gray2-5); margin: 28px 0 10px; }
  .road > span { position: absolute; inset: 0 auto 0 0; border-radius: inherit; background: var(--tennis-green); }
  .road .marker { position: absolute; top: 50%; transform: translate(-50%, -50%); }
  .road .marker .stamp { width: 40px; height: 40px; }
  .road .tick { position: absolute; top: 22px; transform: translateX(-50%); font-size: 11px; color: var(--gray4); white-space: nowrap; font-weight: 700; }
  /* 싶 배지 모아보기 칸: 메달 링 — 얻음 tennis-green / 잠김 gray2-5, 잠김은 내용만 0.3 */
  .badges { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .badge { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 14px 8px; border-radius: var(--radius-card); background: var(--gray2); text-align: center; font-weight: 700; }
  .badge .stamp { width: 56px; height: 56px; --medal-ring: var(--tennis-green); --medal-bg: var(--gray1); }
  .badge.is-locked { color: var(--gray4); }
  .badge.is-locked .stamp { --medal-ring: var(--gray2-5); opacity: .3; }
</style>
</head>
<body data-title="08 함께 달린 거리 & 마일스톤 (아이별)">
<div class="display">
  <div class="app-slot">
    <section class="app-window milestone-screen">
      <header class="app-header">
        <svg class="stamp"><use href="#stamp-car"/></svg>
        <div class="app-header__title headline">준이랑 함께<br><b>달린 길을 모아봤어요</b></div>
        <nav class="tab-bar">
          <div class="tab-bar__item is-selected"><span class="avatar avatar--s">👦</span>준</div>
          <div class="tab-bar__item"><span class="avatar avatar--s">👧</span>서아</div>
        </nav>
      </header>
      <main class="app-content">
        <div class="ms">
          <article class="card hero">
            <div>
              <div class="t-wish-title c-secondary">준이랑 지금까지 함께 달린 거리</div>
              <div><span class="num big">3,214</span><span class="t-title-bold"> km</span></div>
              <div class="t-wish-title">서울에서 부산까지 <span class="c-positive">4번 왕복</span>한 만큼이야 🌏</div>
            </div>
            <div class="hero__compare">
              <div><svg class="stamp stamp--s"><use href="#stamp-highway"/></svg><span class="t-body-sm c-secondary">서울–부산 왕복</span><span class="t-wish-title"><span class="num">4</span>번</span></div>
              <div><svg class="stamp stamp--s"><use href="#stamp-flag"/></svg><span class="t-body-sm c-secondary">할머니 댁</span><span class="t-wish-title"><span class="num">18</span>번 다녀옴</span></div>
              <div><svg class="stamp stamp--s"><use href="#stamp-sun"/></svg><span class="t-body-sm c-secondary">같이 보낸 시간</span><span class="t-wish-title"><span class="num">71</span>시간</span></div>
            </div>
            <div>
              <div class="road">
                <span style="width:8%"></span>
                <div class="marker" style="left:8%"><svg class="stamp"><use href="#stamp-car"/></svg></div>
                <div class="marker" style="left:100%"><svg class="stamp"><use href="#stamp-earth"/></svg></div>
                <div class="tick" style="left:8%">지금 3,214km</div>
                <div class="tick" style="left:94%">지구 한 바퀴 40,075km</div>
              </div>
              <div class="t-body-sm c-tertiary" style="margin-top:24px">다음 목표: 지구 한 바퀴까지 <span class="num">36,861</span>km 남았어</div>
            </div>
          </article>

          <article class="card">
            <div class="card__eyebrow">준이랑 모은 배지</div>
            <div class="badges">
              <div class="badge"><svg class="stamp"><use href="#stamp-flag"/></svg><div class="t-body-sm">첫 나들이<br><span class="c-tertiary">100km</span></div></div>
              <div class="badge"><svg class="stamp"><use href="#stamp-highway"/></svg><div class="t-body-sm">서울–부산<br><span class="c-tertiary">400km</span></div></div>
              <div class="badge"><svg class="stamp"><use href="#stamp-star"/></svg><div class="t-body-sm">천 리 길<br><span class="c-tertiary">1,000km</span></div></div>
              <div class="badge"><svg class="stamp"><use href="#stamp-rain"/></svg><div class="t-body-sm">비 오는 날<br><span class="c-tertiary">10번</span></div></div>
              <div class="badge"><svg class="stamp"><use href="#stamp-night"/></svg><div class="t-body-sm">밤길 친구<br><span class="c-tertiary">20번</span></div></div>
              <div class="badge is-locked"><svg class="stamp"><use href="#stamp-earth"/></svg><div class="t-body-sm">지구 한 바퀴<br><span class="c-tertiary">40,075km</span></div></div>
            </div>
          </article>
        </div>
      </main>
    </section>
  </div>
</div>
<script src="stamps.js"></script>
<script src="frame.js"></script>
</body>
</html>
