<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>차 일기 화면 목록</title>
<link rel="stylesheet" href="app.css">
<style>
  body { background: var(--gray2); padding: 32px 16px 64px; }
  .wrap-page { max-width: 1280px; margin: 0 auto; display: flex; flex-direction: column; gap: 32px; }
  h1 { font-size: 36px; line-height: 44px; }
  h2 { font-size: 24px; line-height: 32px; margin-bottom: 12px; }
  .lead { font-size: 17px; line-height: 26px; color: var(--gray4); }
  .flow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 15px; font-weight: 700; }
  .flow .node { padding: 10px 14px; border-radius: 12px; background: var(--gray1); }
  .flow .node.drive { background: var(--tennis-green); color: var(--gray1); }
  .flow .arrow { color: var(--gray4); font-size: 13px; font-weight: 400; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 380px), 1fr)); gap: 20px; }
  .tile { display: flex; flex-direction: column; border-radius: 20px; overflow: hidden; background: var(--gray1); color: inherit; text-decoration: none; }
  .tile img { width: 100%; aspect-ratio: 1700 / 1184; object-fit: cover; object-position: left top; background: var(--gray2); }
  .tile div { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 4px; }
  .tile b { font-size: 17px; }
  .tile span { font-size: 14px; color: var(--gray4); }
  .tag { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--gray2); margin-right: 4px; }
</style>
</head>
<body>
<div class="wrap-page">
  <header class="col g16">
    <h1>🚗 차 일기 — 화면 시안</h1>
    <p class="lead">싶 디자인 시스템으로 그린 차량 앱 영역 시안 (가로 1700×1184 / 세로 분할 840×1184, 싶 pt × 2).<br>
      2~6번은 세로 분할도 볼 수 있어요. 가이드: <code>docs/design-guide.md</code> · 기획: <code>docs/screen-spec.md</code> · 토큰: <code>design/tokens.css</code></p>
  </header>

  <section>
    <h2>동작 흐름</h2>
    <div class="flow">
      <span class="node">1 온보딩</span><span class="arrow">→</span>
      <span class="node">2 홈</span><span class="arrow">뒷문 열림 →</span>
      <span class="node">3 탑승 팝업</span><span class="arrow">출발 →</span>
      <span class="node drive">4 주행 중</span><span class="arrow">P단 →</span>
      <span class="node">5 도착 팝업</span><span class="arrow">하루 끝 →</span>
      <span class="node">6 그림일기</span><span class="arrow">↔</span>
      <span class="node">7 목록</span><span class="node">8 거리</span><span class="node">9 특별한 날</span><span class="node">10 설정·시연</span>
    </div>
  </section>

  <section>
    <h2>화면</h2>
    <div class="grid" id="grid"></div>
  </section>
</div>
<script>
  const screens = [
    ['01-onboarding', '01 온보딩', '차 이름 짓기 + 가족 등록', ['정차']],
    ['02-home', '02 홈', '오늘 요약 · 아이별 거리 · 최근 일기', ['정차', '세로 분할']],
    ['03-boarding', '03 탑승', '오늘 누구랑 가? 원탭 선택', ['정차', '세로 분할']],
    ['04-driving', '04 주행 중', '조용히 기록 · 최소 정보', ['주행 중', '세로 분할']],
    ['05-arrival', '05 도착', '여기 어디였어? 원탭 장소', ['정차', '세로 분할']],
    ['06-diary', '06 그림일기', '스탬프 + 문장 + 명장면', ['정차', '세로 분할']],
    ['07-diary-list', '07 일기 목록', '월간 캘린더', ['정차']],
    ['08-milestone', '08 함께 달린 거리', '아이별 누적 · 마일스톤', ['정차']],
    ['09-special', '09 특별한 날', '1년 전 오늘 · 타임캡슐 · 결산 (목업)', ['정차']],
    ['10-settings', '10 설정', '가족 관리 · 시연 모드', ['정차']],
  ];
  document.getElementById('grid').innerHTML = screens.map(([f, t, d, tags]) =>
    `<a class="tile" href="${f}.html"><img src="shots/${f}.png" alt="${t} 시안"><div><b>${t}</b><span>${d}</span><p>${tags.map(x => `<span class="tag">${x}</span>`).join('')}</p></div></a>`).join('');
</script>
</body>
</html>
